<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice to Tanglish</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--ac:#d9480f;--bd:#e3e1da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#222220;--tx:#f1f0ec;--mut:#a09f9a;--ac:#ff7a3d;--bd:#34332f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--card:#222220;--tx:#f1f0ec;--mut:#a09f9a;--ac:#ff7a3d;--bd:#34332f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 12px}
select,button,textarea{font:inherit;color:var(--tx)}
select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card)}
.mic{display:block;margin:20px auto;width:96px;height:96px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:38px;cursor:pointer}
.mic.on{animation:p 1.2s infinite}
@keyframes p{50%{box-shadow:0 0 0 18px rgba(217,72,15,.2)}}
.st{text-align:center;color:var(--mut);font-size:14px;min-height:20px}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
textarea{width:100%;min-height:130px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:17px;line-height:1.5;resize:vertical}
#ta{min-height:70px;font-size:15px;color:var(--mut)}
.row{display:flex;gap:10px;margin-top:12px}
.row button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
</style>
</head>
<body>
<h1>🎙️ Voice to Tanglish</h1>
<select id="lang">
  <option value="ta-IN">Tamil speech → Tanglish</option>
  <option value="en-IN">English speech</option>
</select>
<button class="mic" id="mic" aria-label="Start or stop">🎤</button>
<div class="st" id="st">Tap the mic and speak</div>
<label>Tanglish (you can edit)</label>
<textarea id="out" placeholder="Your text appears here"></textarea>
<label>Tamil script (dictate here with keyboard 🎤)</label>
<textarea id="ta" placeholder="Tap here, then press the 🎤 on your keyboard and speak in Tamil"></textarea>
<div class="row"><button id="copy">Copy</button><button id="clear">Clear</button></div>
<script>
const C={'க':'k','ங':'ng','ச':'s','ஞ':'nj','ட':'t','ண':'n','த':'th','ந':'n','ப':'p','ம':'m','ய':'y','ர':'r','ல':'l','வ':'v','ழ':'zh','ள':'l','ற':'r','ன':'n','ஜ':'j','ஷ':'sh','ஸ':'s','ஹ':'h'};
const V={'அ':'a','ஆ':'aa','இ':'i','ஈ':'ee','உ':'u','ஊ':'oo','எ':'e','ஏ':'e','ஐ':'ai','ஒ':'o','ஓ':'o','ஔ':'au','ஃ':'h'};
const S={'ா':'aa','ி':'i','ீ':'ee','ு':'u','ூ':'oo','ெ':'e','ே':'e','ை':'ai','ொ':'o','ோ':'o','ௌ':'au'};
const NAS={'ங':1,'ஞ':1,'ண':1,'ந':1,'ம':1,'ன':1};
const VO={'க':'g','ட':'d','ப':'b'};
const NV={'க':'g','ச':'j','ட':'d','த':'dh','ப':'b'};
function tr(t){let o='',pv=false,pn='';for(let i=0;i<t.length;i++){const c=t[i];
 if(C[c]){const n=t[i+1],pl=n==='்';let r=C[c];
  if(c==='ற'){if(pl&&t[i+2]==='ற')r='t';else if(pn==='ன')r='dr'}
  else if(pn&&NV[c])r=NV[c];
  else if(pv&&!pl&&VO[c])r=VO[c];
  o+=r;
  if(pl){i++;pv=false;pn=NAS[c]?c:''}
  else if(S[n]!==undefined){o+=S[n];i++;pv=true;pn=''}
  else{o+='a';pv=true;pn=''}
 }else if(V[c]!==undefined){o+=V[c];pv=true;pn=''}
 else if(c==='்'){}
 else{o+=c;pv=false;pn=''}
}return o}
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false,finalTa='',finalOut='';
function render(interim){
  const lang=$('lang').value;
  const ta=finalTa+(interim||'');
  $('ta').value=lang==='ta-IN'?ta:'';
  const tx=lang==='ta-IN'?tr(ta):ta;
  if(!interim){$('out').value=finalOut}
  else{$('out').value=finalOut+(lang==='ta-IN'?tr(interim):interim)}
}
function start(){
  if(!SR){$('st').textContent='Speech recognition isn’t supported here. Open in Safari on iPhone.';return}
  rec=new SR();rec.lang=$('lang').value;rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal){
        finalTa+=t+' ';
        finalOut+=($('lang').value==='ta-IN'?tr(t):t)+' ';
      }else interim+=t;
    }
    render(interim);
  };
  rec.onerror=e=>{$('st').textContent='Error: '+e.error+(e.error==='not-allowed'?' — use the keyboard 🎤 in the Tamil box below instead':'')};
  rec.onend=()=>{if(listening){try{rec.start()}catch(_){}}};
  try{rec.start();listening=true;$('mic').classList.add('on');$('st').textContent='Listening… tap to stop'}catch(_){}
}
function stop(){listening=false;if(rec)rec.stop();$('mic').classList.remove('on');$('st').textContent='Stopped. Tap to continue'}
$('mic').onclick=()=>listening?stop():start();
$('lang').onchange=()=>{if(listening)stop()};
$('out').oninput=()=>{finalOut=$('out').value+' '};
$('ta').oninput=()=>{finalTa=$('ta').value;finalOut=tr(finalTa);$('out').value=finalOut};
$('copy').onclick=async()=>{
  try{await navigator.clipboard.writeText($('out').value);$('st').textContent='Copied ✓'}
  catch(_){$('out').select();document.execCommand('copy');$('st').textContent='Copied ✓'}
};
$('clear').onclick=()=>{finalTa='';finalOut='';$('out').value='';$('ta').value=''};
</script>
</body>
</html>
